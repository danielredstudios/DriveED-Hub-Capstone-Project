name: driveed_hub

services:
  app:
    container_name: driveed_hub_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8004:80"
    environment:
      APP_NAME: "Driving School Management System"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8004"
      DB_CONNECTION: mysql
      DB_HOST: driveed_hub_db
      DB_PORT: 3306
      DB_DATABASE: drivingapp
      DB_USERNAME: driveed_user
      DB_PASSWORD: driveed_password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    networks:
      - driveed_hub_net

  db:
    container_name: driveed_hub_db
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: drivingapp
      MYSQL_USER: driveed_user
      MYSQL_PASSWORD: driveed_password
      MYSQL_ROOT_PASSWORD: driveed_root_password
    volumes:
      - driveed_hub_db_data:/var/lib/mysql
    ports:
      # Port 33064 on host prevents any conflict with existing local MySQL or other DB containers on 3306
      - "127.0.0.1:33064:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pdriveed_root_password || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - driveed_hub_net

networks:
  driveed_hub_net:
    name: driveed_hub_net
    driver: bridge

volumes:
  driveed_hub_db_data:
    name: driveed_hub_db_data
